name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "VPS secrets not set yet, skipping deploy."; fi
      - name: Deploy over SSH
        if: steps.check.outputs.skip != '1'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/mevix
            git fetch origin main && git reset --hard origin/main
            bash deploy/update.sh
